[package]
name = "wpactrl"
description = "wpa_supplicant control interface library"
edition = "2024"
categories = [ "api-bindings", "embedded", "network-programming", "os" ]
keywords = [ "hostapd", "wpa_cli", "wpa_ctrl", "wpa_supplicant" ]
license = "MIT"
repository = "https://github.com/spease/wpa-ctrl-rs"
version = "0.5.1"
authors = [ "Sauyon Lee <s@uyon.co>", "Steven Pease <peasteven@gmail.com>" ]

[features]
sync = ["futures"]

[dependencies]
log = { version = "0.4.27", default-features = false }
libc = { version = "0.2.172", default-features = false }
tokio = {version = "1.45", default-features = false, features = ["fs", "net"] }
futures = { version = "0.3.31", default-features = false, features = ["executor"], optional = true}

[dev-dependencies]
tokio = {version = "1.45", default-features = false, features = ["macros", "rt", "sync", "time"] }
